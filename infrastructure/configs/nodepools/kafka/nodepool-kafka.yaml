apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: kafka
spec:
  weight: 100

  template:
    metadata:
      labels:
        workload: kafka
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: kafka

      taints:
        - key: workload
          value: kafka
          effect: NoSchedule

      expireAfter: Never
      terminationGracePeriod: 30m

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m6i", "m6a", "m7i", "r6i", "r7i"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8"]

  limits:
    cpu: "48"

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
