apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spark-gpu
spec:
  weight: 25

  template:
    metadata:
      labels:
        workload: spark-gpu
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: spark-gpu

      taints:
        - key: workload
          value: spark-gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule

      expireAfter: 24h

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g5", "g6", "g6e", "gr6"]
        - key: karpenter.k8s.aws/instance-gpu-manufacturer
          operator: In
          values: ["nvidia"]
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: In
          values: ["1"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8", "16"]

  limits:
    cpu: "96"
    nvidia.com/gpu: "8"

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
