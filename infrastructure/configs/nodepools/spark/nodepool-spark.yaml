apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spark
spec:
  weight: 50

  template:
    metadata:
      labels:
        workload: spark
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: spark

      taints:
        - key: workload
          value: spark
          effect: NoSchedule

      expireAfter: 15m

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: Gt
          values: ["3"]

  limits:
    cpu: "200"

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
