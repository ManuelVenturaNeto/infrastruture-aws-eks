apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: airflow
spec:
  weight: 100

  template:
    metadata:
      labels:
        workload: airflow
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: airflow

      taints:
        - key: workload
          value: airflow
          effect: NoSchedule

      expireAfter: Never

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m6i", "m6a", "m7i"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4"]

  limits:
    cpu: "16"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
