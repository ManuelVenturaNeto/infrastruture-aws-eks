apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: mlflow
spec:
  role: kube-system-experiment-karpenter-node

  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: kube-system-experiment-eks

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: kube-system-experiment-eks
    - name: kube-system-experiment-mlflow-nodes

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Project: kube-system-experiment
    ManagedBy: karpenter
    Workload: mlflow
