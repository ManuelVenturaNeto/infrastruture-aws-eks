apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spark-history
  namespace: spark-history
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spark-history
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
