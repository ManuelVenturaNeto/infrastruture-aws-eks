apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spark
spec:
  weight: 50

  template:
    metadata:
      labels:
        workload: spark
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: spark

      taints:
        - key: workload
          value: spark
          effect: NoSchedule

      expireAfter: 24h

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c6i", "c6a", "c7i", "m6i", "m6a", "m7i", "r6i", "r7i"]
          minValues: 4
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4", "8", "16"]

  limits:
    cpu: "200"

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
