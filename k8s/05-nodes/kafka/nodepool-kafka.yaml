apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: kafka
spec:
  weight: 100

  template:
    metadata:
      labels:
        workload: kafka
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: kafka

      taints:
        - key: workload
          value: kafka
          effect: NoSchedule

      expireAfter: Never
      terminationGracePeriod: 1h

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8"]

  limits:
    cpu: "48"

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
