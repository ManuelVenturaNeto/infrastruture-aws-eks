apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: shopping-etl-rapids
  namespace: spark-jobs
spec:
  type: Python
  mode: cluster
  image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/kube-system-experiment/spark-rapids:1.0.0
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/jobs/etl_process/01_spark_pipe_shopping/main.py
  arguments:
    - "--input"
    - "file:///opt/spark/datasets/shopping"
    - "--rows"
    - "20"
  sparkVersion: 3.5.9

  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 20
    onSubmissionFailureRetries: 3
    onSubmissionFailureRetryInterval: 30

  sparkConf:
    "spark.plugins": "com.nvidia.spark.SQLPlugin"
    "spark.rapids.sql.enabled": "true"
    "spark.rapids.sql.explain": "NOT_ON_GPU"
    "spark.rapids.sql.concurrentGpuTasks": "2"
    "spark.rapids.memory.pinnedPool.size": "1G"
    "spark.executor.resource.gpu.amount": "1"
    "spark.executor.resource.gpu.vendor": "nvidia.com"
    "spark.executor.resource.gpu.discoveryScript": "/opt/spark/examples/src/main/scripts/getGpusResources.sh"
    "spark.task.resource.gpu.amount": "0.5"

  driver:
    cores: 1
    memory: 2g
    serviceAccount: spark
    annotations:
      karpenter.sh/do-not-disrupt: "true"
    nodeSelector:
      workload: spark
      karpenter.sh/capacity-type: on-demand
    tolerations:
      - key: workload
        operator: Equal
        value: spark
        effect: NoSchedule

  executor:
    instances: 2
    cores: 2
    memory: 4g
    memoryOverhead: 2g
    gpu:
      name: nvidia.com/gpu
      quantity: 1
    nodeSelector:
      workload: spark-gpu
    tolerations:
      - key: workload
        operator: Equal
        value: spark-gpu
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
